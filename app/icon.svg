<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
    <defs>
        <!-- Gradient from purple/violet to cyan spanning across the icon -->
        <linearGradient id="grad" x1="120" y1="0" x2="380" y2="0" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#7B33FF" />
            <stop offset="50%" stop-color="#0066FF" />
            <stop offset="100%" stop-color="#00E5FF" />
        </linearGradient>
    </defs>
    
    <!-- Dark navy background matching the image -->
    <rect width="100%" height="100%" fill="#13122E" />

    <!-- Group containing all the line-art with shared stroke properties -->
    <g stroke="url(#grad)" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        
        <!-- Briefcase Handle -->
        <path d="M 220 160 V 144 C 220 138 224 134 230 134 H 270 C 276 134 280 138 280 144 V 160" />
        <line x1="220" y1="146" x2="280" y2="146" />
        
        <!-- Briefcase Main Body -->
        <rect x="180" y="160" width="140" height="75" rx="5" />
        
        <!-- Briefcase Inner Bottom Line -->
        <line x1="180" y1="220" x2="320" y2="220" />
        
        <!-- Briefcase Flap (V-Shape) -->
        <path d="M 180 185 L 246 206 C 248.5 206.8 251.5 206.8 254 206 L 320 185" />
        
        <!-- Briefcase Buckles/Clasps -->
        <line x1="233" y1="202" x2="243" y2="202" />
        <line x1="257" y1="202" x2="267" y2="202" />

        <!-- Network Connection Lines -->
        <line x1="184" y1="235" x2="134" y2="285" />
        <line x1="217" y1="235" x2="217" y2="315" />
        <line x1="250" y1="235" x2="250" y2="345" />
        <line x1="283" y1="235" x2="283" y2="315" />
        <line x1="316" y1="235" x2="366" y2="285" />

        <!-- Network Node Circles (Filled with the background color so they appear hollow) -->
        <circle cx="134" cy="285" r="12" fill="#13122E" />
        <circle cx="217" cy="315" r="12" fill="#13122E" />
        <circle cx="250" cy="345" r="12" fill="#13122E" />
        <circle cx="283" cy="315" r="12" fill="#13122E" />
        <circle cx="366" cy="285" r="12" fill="#13122E" />
    </g>

    <!-- PORTFOLIO Text -->
    <text x="250" y="415" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="32" letter-spacing="2" text-anchor="middle" fill="url(#grad)">PORTFOLIO</text>
</svg>
